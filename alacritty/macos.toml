[window]
opacity = 0
# opacity = 1
# blur = false

[font]
normal = { family = "Liga SFMono Nerd Font", style = "Regular" }
size = 9.0


[colors.primary]
background = "#16181a"
foreground = "#ffffff"
dim_foreground = "#7b8496"

[colors.cursor]
text = "#16181a"
cursor = "#00ffff" # Neon cyan cursor for a nice pop

[colors.selection]
text = "#ffffff"
background = "#ff007f" # Vibrant pink selection accent

[colors.normal]
black   = "#232629"   # Slightly lighter black for better contrast against background
red     = "#ff2e63"   # Vivid neon red
green   = "#00ff66"   # Electric neon green
yellow  = "#ffe600"   # Pure vibrant yellow
blue    = "#0066ff"   # Intense electric blue
magenta = "#df00ff"   # Bright neon magenta
cyan    = "#00e5ff"   # Sharp neon cyan
white   = "#eaeaea"

[colors.bright]
black   = "#7b8496"
red     = "#ff0055"   # Ultra-vibrant red/pink
green   = "#33ff77"   # Brighter mint neon
yellow  = "#ff9900"   # High-voltage orange
blue    = "#00a2ff"   # Vivid sky blue
magenta = "#ff00ff"   # Pure laser magenta
cyan    = "#00ffff"   # Pure cyber cyan
white   = "#ffffff"
