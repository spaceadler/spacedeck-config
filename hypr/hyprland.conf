exec-once = pipewire
exec-once = wireplumber
exec-once = pipewire-pulse
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = ags run ~/.config/flatShell

source = ~/.config/hypr/current_theme.conf

env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Posy_Cursor
env = XCURSOR_SIZE,28

bindm = SUPER, mouse:272, movewindow

bind = SUPER, W, killactive,
bind = SUPER, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

bind = SUPER, RETURN, exec, alacritty
bind = SUPER, E, exec, nautilus
bind = SUPER, SPACE, exec, anyrun

bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreen
bind = SUPER, C, centerwindow

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, S, workspace, m+1
bind = SUPER, A, workspace, m-1
bind = SUPER, D, workspace, previous

bind = SUPER, T, exec, alacritty

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

binde = SUPER, U, resizeactive, -30 0
binde = SUPER, P, resizeactive, 30 0
binde = SUPER, I, resizeactive, 0 -30
binde = SUPER, O, resizeactive, 0 30


# ==========================================
# INPUT CONFIGURATION (Keyboard & Mouse)
# ==========================================

input {
    # Layouts: eu (EURkey) and ara (Arabic)
    # Toggle shortcut: Alt + Space
    kb_layout = eu,ara
    kb_options = grp:alt_space_toggle

    touchpad {
        natural_scroll = true
    }
}


# ==========================================
# GENERAL CONFIGURATION (Borders & Gaps)
# ==========================================

general {
    gaps_in = 2
    gaps_out = 8
    border_size = 0
    allow_tearing = true
}

# ==========================================
# DECORATION & ANIMATIONS
# ==========================================

decoration {
    rounding = 5
}

animations {
    enabled = true
    # Default high-performance bezier curves are kept active here
}


# ==========================================
# BINDINGS (Workspace Wraparounds)
# ==========================================
# Workspace navigation settings (v0.40+ style syntax)
# This enables clean loop-around logic when shifting workspaces

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}


# ==========================================
# MEDIA & BRIGHTNESS CONTROLS (Hardware Keys)
# ==========================================

# Audio
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

# Media Controls
bindl = , XF86Play, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# Brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+

# Lock Screen
bind = , F9, exec, hyprlock
# Lock the system when the laptop lid is closed
bindl = , switch:on:Lid Switch, exec, hyprlock


misc {
    force_default_wallpaper = 1 # Disables the anime mascot
    disable_hyprland_logo = true # Disables the generic logo background
}

