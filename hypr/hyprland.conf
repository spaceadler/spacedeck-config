# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ENVIRONMENT VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Posy_Cursor
env = XCURSOR_SIZE,28

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# AUTOSTART DAEMONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 1. D-Bus & Audio Layer (Prioritized)
#exec-once = dbus-update-activation-environment --all
exec-once = pipewire & sleep 1 && wireplumber & sleep 1 && pipewire-pulse
exec-once = ~/.config/hypr/cover-fetcher.sh &
exec-once = syncthing &

# 2. Core UI & Background
exec-once = hyprpaper
#exec-once = waybar
exec-once = tide-island
exec-once = mako
exec-once = nm-applet --indicator

# 3. System Utilities
exec-once = hypridle
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/gsd-rfkill

# 4. Clipboard History (Rofi dependency)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# THEME & SOURCING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
source = ~/.cache/wal/colors-hyprland.conf

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# INPUT CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
input {
    kb_layout = eu,ara
    kb_options = grp:alt_space_toggle
    touchpad {
        natural_scroll = true
    }
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GENERAL, LAYOUT & XWAYLAND
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
general {
    gaps_in = 4
    gaps_out = 4
    border_size = 0
    allow_tearing = true
    col.active_border = $color4 $color6 45deg
    col.inactive_border = $color4 $color6 45deg
}

xwayland {
    force_zero_scaling = true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DECORATIONS & ANIMATIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
decoration {
    rounding         = 5
    active_opacity   = 0.85
    inactive_opacity = 0.85
    dim_inactive     = false

    blur {
        enabled = true
        size    = 5
        passes  = 3
        new_optimizations = true
        xray    = true

        # The Liquid Refraction Variables:
        contrast   = 1.5  # Sharpens the blurred background for a "wet" look
        vibrancy   = 1.5  # Pulls your saturated Pywal colors straight through
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, once
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
    animation = specialWorkspace, 1, 5, wind, slidevert
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}

layerrule {
    name = tide_island_blur
    blur = true
    ignore_alpha = 0
    match:namespace = quickshell
}

 layerrule {
    name = waybar_blur
    blur = true
    ignore_alpha = 0.1
    match:namespace = waybar
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# KEYBINDINGS: APPS & MENUS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = SUPER, Space, exec, rofi -show drun
bind = SUPER, P, exec, ~/.config/rofi/scripts/wallpaper-picker.sh
bind = SUPER, C, exec, ~/.config/rofi/scripts/clipboard.sh
bind = SUPER, J, exec, ~/.config/rofi/scripts/emoji-selector.sh
bind = SUPER, ESCAPE, exec, ags -r "togglePopup('powermenu')"

bind = SUPER, RETURN, exec, alacritty
bind = SUPER, T, exec, alacritty
bind = SUPER, E, exec, nautilus
bind = SUPER, TAB, exec, qs ipc -p /usr/share/tide-island call overview toggle

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# KEYBINDINGS: WINDOW MANAGEMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = SUPER, W, killactive,
bind = SUPER, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreen
bind = SUPER, C, centerwindow

bindm = SUPER, mouse:272, movewindow

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

binde = SUPER, U, resizeactive, -30 0
binde = SUPER, P, resizeactive, 30 0
binde = SUPER, I, resizeactive, 0 -30
binde = SUPER, O, resizeactive, 0 30

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# KEYBINDINGS: WORKSPACES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, S, workspace, m+1
bind = SUPER, A, workspace, m-1
bind = SUPER, D, workspace, previous

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# KEYBINDINGS: MEDIA & HARDWARE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindel = , XF86AudioMute, exec,        wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

bindl = , XF86Play, exec,      playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindel = , XF86MonBrightnessUp, exec,   brightnessctl s 5%+

bind = , F9, exec,                    hyprlock
bindl = , switch:on:Lid Switch, exec, hyprlock

bind = , PRINT, exec, grim - | tee $HOME/Photos/Screenshot_$(date +'%Y-%m-%d_%H%M%S').png | wl-copy
bind = SHIFT, PRINT, exec, grim -g "$(slurp)" - | tee $HOME/Photos/Screenshot_$(date +'%Y-%m-%d_%H%M%S').png | wl-copy
