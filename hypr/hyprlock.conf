# ==========================================
# HYPRLOCK CONFIGURATION
# ==========================================

# 1. The Blurred Background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

# 2. General Settings
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# 3. The Digital Clock
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(255, 255, 255, 0.8)
    font_size = 100
    font_family = sans-serif
    position = 0, -150
    halign = center
    valign = top
}

# 4. The Password Field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = sans-serif
    placeholder_text =
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

